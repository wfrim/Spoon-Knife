name: Deploy Supabase

# Applies new migrations and deploys the Edge Functions to your Supabase
# project, after the database and function tests pass. Does nothing until the
# repo has the SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD and
# SUPABASE_ACCESS_TOKEN secrets (see docs/SETUP.md).
on:
  push:
    branches: [apartment-line, main]
    paths: ["supabase/migrations/**", "supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task test
        working-directory: supabase/functions

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets aren't set yet; skipping deploy (see docs/SETUP.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy place-call call-token --project-ref "$PROJECT_REF"
