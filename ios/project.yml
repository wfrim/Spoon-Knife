# Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen
name: ApartmentLine
options:
  bundleIdPrefix: app.apartmentline
  deploymentTarget:
    iOS: "17.2"   # push-started Live Activities (plan B5)
  createIntermediateGroups: true

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.5.0

targets:
  ApartmentLine:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ApartmentLine
    dependencies:
      - package: LiveKit
      - target: ApartmentLineClip
    entitlements:
      path: ApartmentLine/ApartmentLine.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:apartmentline.app
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"   # CI sets the build number
    info:
      path: ApartmentLine/Info.plist
      properties:
        CFBundleDisplayName: Apartment Line
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Location lets your apartment ring you when you're home.
        NSLocationAlwaysAndWhenInUseUsageDescription: Apartment Line checks whether you're near home, even when the app is closed, so calls to your apartment only ring you when you're there. It only reports home or away, never where you are.
        UIBackgroundModes: [fetch, voip, audio]
        NSMicrophoneUsageDescription: Your microphone is used during calls and when you record a voicemail or greeting.
        BGTaskSchedulerPermittedIdentifiers: [app.apartmentline.heartbeat]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)

  # The App Clip: opens from invite links, joins the home, offers the full app.
  ApartmentLineClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: AppClip
      - path: ApartmentLine/Backend
      - path: ApartmentLine/Views/InviteJoinView.swift
    entitlements:
      path: AppClip/AppClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)$(APP_BUNDLE_ID)
        com.apple.developer.associated-domains:
          - appclips:apartmentline.app
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Clip
        DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"   # CI sets the build number
    info:
      path: AppClip/Info.plist
      properties:
        CFBundleDisplayName: Apartment Line
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
