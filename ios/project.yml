# Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen
name: ApartmentLine
options:
  bundleIdPrefix: app.apartmentline
  deploymentTarget:
    iOS: "17.2"   # push-started Live Activities (plan B5)
  createIntermediateGroups: true

targets:
  ApartmentLine:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ApartmentLine
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(APP_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ApartmentLine/Info.plist
      properties:
        CFBundleDisplayName: Apartment Line
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Location lets your apartment ring you when you're home.
        NSLocationAlwaysAndWhenInUseUsageDescription: Apartment Line checks whether you're near home, even when the app is closed, so calls to your apartment only ring you when you're there. It only reports home or away, never where you are.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.apartmentline.heartbeat]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
